<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>石川雅也 | Masaya Ishikawa</title>
<meta name="description" content="新規事業をつくり、自分で経営することを目指しています。">
<meta name="theme-color" content="#1D4ED8">
<style>
:root{
  --main:#1D4ED8;
  --main-dark:#1E40AF;
  --bg:#F3F6FC;
  --card:#FFFFFF;
  --text:#14213D;
  --sub:#4B5563;
  --line:#D7DFEF;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0B1220;
    --card:#131C31;
    --text:#E8EDF8;
    --sub:#A7B1C6;
    --line:#26324D;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",system-ui,sans-serif;
  line-height:1.8;
}
.wrap{max-width:480px;margin:0 auto;min-height:100vh;background:var(--card)}
.cover{
  position:relative;
  height:150px;
  background:var(--main);
  overflow:hidden;
}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.avatar{
  position:relative;
  width:112px;height:112px;
  margin:-56px auto 0;
  border-radius:50%;
  border:4px solid var(--card);
  background:var(--main-dark);
  color:#fff;
  display:flex;align-items:center;justify-content:center;
  font-size:44px;font-weight:500;
  overflow:hidden;
}
.avatar img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
main{padding:16px 24px 40px;text-align:center}
h1{margin:12px 0 0;font-size:24px;font-weight:600;letter-spacing:.04em}
.roman{margin:0;font-size:14px;color:var(--sub);letter-spacing:.08em}
.title{
  display:inline-block;
  margin:12px 0 0;
  padding:4px 14px;
  border-radius:999px;
  background:var(--main);
  color:#fff;
  font-size:14px;
}
.intro{
  margin:20px 0 0;
  font-size:15px;
  text-align:left;
  color:var(--text);
  text-wrap:pretty;
  word-break:auto-phrase;
}
.links{margin:28px 0 0;padding:0;list-style:none;display:grid;gap:12px}
.links a{
  display:block;
  padding:14px 16px;
  border-radius:12px;
  background:var(--main);
  color:#fff;
  text-decoration:none;
  font-size:16px;
  font-weight:500;
}
.links a:hover,.links a:focus-visible{background:var(--main-dark)}
.links a.sub{
  background:transparent;
  color:var(--main);
  border:1.5px solid var(--main);
}
@media (prefers-color-scheme: dark){
  .links a.sub{color:#8FB0FF;border-color:#8FB0FF}
}
.links a.sub:hover,.links a.sub:focus-visible{background:rgba(29,78,216,.1)}
footer{margin-top:32px;font-size:12px;color:var(--sub)}
</style>
</head>
<body>
<div class="wrap">
  <div class="cover">
    <img src="cover.jpg" alt="" onerror="this.remove()">
  </div>
  <div class="avatar" aria-hidden="true">
    雅
    <img src="photo.jpg" alt="" onerror="this.remove()">
  </div>
  <main>
    <h1>石川 雅也</h1>
    <p class="roman">Masaya Ishikawa</p>
    <p class="title">新規事業を準備中／お話を聞かせてください</p>

    <p class="intro">
      新規事業をつくり、自分で経営することを目指しています。<br>
      事業のアイデアを具体にするために、いろいろな方のお話を聞かせていただきたいと考えています。<br>
      よろしければ、InstagramのDMで、お気軽にご連絡ください。
    </p>

    <ul class="links">
      <li><a href="https://www.instagram.com/masaya_biz/" target="_blank" rel="noopener">お話を聞かせてください（Instagram）</a></li>
      <li><a class="sub" href="contact.vcf" download="Masaya_Ishikawa.vcf">連絡先を保存する</a></li>
      <li><a class="sub" href="mailto:masa.218b@gmail.com">メールで連絡する</a></li>
      <li><a class="sub" href="https://www.linkedin.com/in/masaishik/" target="_blank" rel="noopener">LinkedIn</a></li>
    </ul>

    <footer>&copy; Masaya Ishikawa</footer>
  </main>
</div>
</body>
</html>
